<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica: Sales Binarias (Nomenclatura Stock)</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f2f6ff; text-align: center; padding: 20px; }
    h1 { color: #2c3e50; }
    #ejercicio { font-size: 1.3em; margin: 20px; font-weight: bold; }
    input { padding: 8px; font-size: 1em; margin: 10px; width: 280px; }
    button { padding: 10px 15px; font-size: 1em; margin: 10px; cursor: pointer; border-radius: 5px; border: none; }
    button:hover { background-color: #dce6ff; }
    #resultado { margin-top: 20px; font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Sales Binarias - Nomenclatura Stock</h1>
  <p>Escribe el <b>nombre</b> si aparece la fórmula, o la <b>fórmula</b> si aparece el nombre.</p>

  <div id="ejercicio">Cargando ejercicio…</div>

  <input type="text" id="respuesta" placeholder="Escribe tu respuesta aquí">
  <br>
  <button onclick="verificar()">Verificar</button>
  <button onclick="nuevoEjercicio()">Nueva práctica</button>

  <div id="resultado"></div>

  <script>
    // ===== 1) Datos =====
    const metales = [
      { simbolo: "Li", nombre: "Litio", valencias: [1] },
      { simbolo: "Na", nombre: "Sodio", valencias: [1] },
      { simbolo: "K",  nombre: "Potasio", valencias: [1] },
      { simbolo: "Rb", nombre: "Rubidio", valencias: [1] },
      { simbolo: "Cs", nombre: "Cesio", valencias: [1] },
      { simbolo: "Fr", nombre: "Francio", valencias: [1] },

      { simbolo: "Be", nombre: "Berilio", valencias: [2] },
      { simbolo: "Mg", nombre: "Magnesio", valencias: [2] },
      { simbolo: "Ca", nombre: "Calcio", valencias: [2] },
      { simbolo: "Sr", nombre: "Estroncio", valencias: [2] },
      { simbolo: "Ba", nombre: "Bario", valencias: [2] },
      { simbolo: "Ra", nombre: "Radio", valencias: [2] },

      { simbolo: "Fe", nombre: "Hierro",   valencias: [2, 3] },
      { simbolo: "Cu", nombre: "Cobre",    valencias: [1, 2] },
      { simbolo: "Ag", nombre: "Plata",    valencias: [1] },
      { simbolo: "Au", nombre: "Oro",      valencias: [1, 3] },
      { simbolo: "Hg", nombre: "Mercurio", valencias: [1, 2] },
      { simbolo: "Zn", nombre: "Zinc",     valencias: [2] },
      { simbolo: "Cd", nombre: "Cadmio",   valencias: [2] },
      { simbolo: "Ni", nombre: "Níquel",   valencias: [2, 3] },
      { simbolo: "Co", nombre: "Cobalto",  valencias: [2, 3] },
      { simbolo: "Mn", nombre: "Manganeso",valencias: [2, 3, 4, 6, 7] },
      { simbolo: "Cr", nombre: "Cromo",    valencias: [2, 3, 6] },
      { simbolo: "Pt", nombre: "Platino",  valencias: [2, 4] },
      { simbolo: "Pd", nombre: "Paladio",  valencias: [2, 4] },
      { simbolo: "Ti", nombre: "Titanio",  valencias: [3, 4] },
      { simbolo: "Sn", nombre: "Estaño",   valencias: [2, 4] },
      { simbolo: "Pb", nombre: "Plomo",    valencias: [2, 4] },
      { simbolo: "Sb", nombre: "Antimonio",valencias: [3, 5] },
      { simbolo: "Bi", nombre: "Bismuto",  valencias: [3, 5] },
      { simbolo: "Al", nombre: "Aluminio", valencias: [3] },
      { simbolo: "Ga", nombre: "Galio",    valencias: [3] },
      { simbolo: "In", nombre: "Indio",    valencias: [3] },
      { simbolo: "Tl", nombre: "Talio",    valencias: [1, 3] }
    ];

    const radicales = [
      { simbolo: "F",  nombre: "Fluoruro",  valencia: -1 },
      { simbolo: "Cl", nombre: "Cloruro",   valencia: -1 },
      { simbolo: "Br", nombre: "Bromuro",   valencia: -1 },
      { simbolo: "I",  nombre: "Yoduro",    valencia: -1 },
      { simbolo: "S",  nombre: "Sulfuro",   valencia: -2 },
      { simbolo: "Se", nombre: "Seleniuro", valencia: -2 },
      { simbolo: "Te", nombre: "Telururo",  valencia: -2 },
      { simbolo: "N",  nombre: "Nitruro",   valencia: -3 },
      { simbolo: "P",  nombre: "Fosfuro",   valencia: -3 },
      { simbolo: "As", nombre: "Arseniuro", valencia: -3 },
      { simbolo: "C",  nombre: "Carburo",   valencia: -4 }
    ];

    // ===== 2) Estado del ejercicio =====
    let ejercicioActual = {};

    // ===== 3) Lógica =====
    function generarEjercicio() {
      try {
        const metal = aleatorio(metales);
        const valMetal = aleatorio(metal.valencias);
        const rad = aleatorio(radicales);
        const valRadAbs = Math.abs(rad.valencia);

        // Subíndices por cruce y simplificación
        let subMetal = valRadAbs;
        let subRad   = valMetal;
        const d = mcd(subMetal, subRad);
        subMetal /= d;
        subRad   /= d;

        const formula = metal.simbolo + (subMetal > 1 ? subMetal : "") +
                        rad.simbolo   + (subRad   > 1 ? subRad   : "");

        let nombre = rad.nombre + " de " + metal.nombre;
        if (metal.valencias.length > 1) {
          nombre += " (" + numeroRomano(valMetal) + ")";
        }

        const mostrarFormula = Math.random() < 0.5;
        ejercicioActual = {
          pregunta: mostrarFormula ? formula : nombre,
          respuesta: mostrarFormula ? nombre  : formula
        };

        const ej = document.getElementById("ejercicio");
        ej.innerText = "👉 " + ejercicioActual.pregunta;

        const res = document.getElementById("resultado");
        res.innerText = "";
        document.getElementById("respuesta").value = "";
      } catch (e) {
        console.error("Error en generarEjercicio:", e);
        const ej = document.getElementById("ejercicio");
        if (ej) ej.innerText = "⚠️ Ocurrió un error. Revisa la consola (F12 → Console).";
      }
    }

    function verificar() {
      try {
        const resp = document.getElementById("respuesta").value.trim();
        if (resp === ejercicioActual.respuesta) {
          mostrarResultado("✅ Correcto", "green");
        } else {
          mostrarResultado("❌ Incorrecto. Respuesta correcta: " + ejercicioActual.respuesta, "red");
        }
      } catch (e) {
        console.error("Error en verificar:", e);
      }
    }

    function nuevoEjercicio() { generarEjercicio(); }

    // ===== 4) Utilidades =====
    function aleatorio(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function mcd(a, b) { return b === 0 ? a : mcd(b, a % b); }
    function numeroRomano(num) {
      const rom = {1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX",10:"X"};
      return rom[num] || String(num);
    }
    function mostrarResultado(txt, color) {
      const r = document.getElementById("resultado");
      r.innerText = txt;
      r.style.color = color;
    }

    // ===== 5) Arranque (script al final del body, DOM ya cargado) =====
    generarEjercicio();
  </script>
</body>
</html>
